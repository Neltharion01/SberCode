[project]
name = "sbercode"
version = "0.1.0"
description = "AI coding assistant"
readme = "README.md"
authors = [
    { name = "Neltharion", email = "NtNeltharion@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
]

[project.scripts]
sbercode = "sbercode:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
